name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 데이터 검증
        run: node tests/validate-data.mjs
      - name: Playwright 설치
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 스모크 테스트 (240초 시뮬레이션)
        run: node tests/smoke.mjs 240
      - name: 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/
